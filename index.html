function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function brl(v){return(Number(v)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});}
function fmtDataBR(iso){if(!iso)return"—";const[y,m,d]=iso.split("-");return`${d}/${m}/${y}`;}
function rotuloParcela(l){
  let s="";
  if(l.numeroParcela)s+=` (parcela ${l.numeroParcela})`;
  if(l.juros)s+=` · +${brl(l.juros)} juros`;
  if(l.desconto)s+=` · -${brl(l.desconto)} desconto`;
  return s;
}
function hojeISO(){return new Date().toISOString().slice(0,10);}
function mesAtualRef(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
function shiftMes(ref,delta){const[y,m]=ref.split("-").map(Number);const d=new Date(y,m-1+delta,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
// Firestore rejeita undefined/NaN/Infinity — limpa antes de salvar.
function stripUndefined(v){
  if(Array.isArray(v))return v.map(stripUndefined);
  if(v&&typeof v==="object"){const o={};for(const k in v)if(v[k]!==undefined)o[k]=stripUndefined(v[k]);return o;}
  if(typeof v==="number"&&!isFinite(v))return null;
  return v;
}

function FSelect({label,children,...p}){return(<label style={{display:"flex",flexDirection:"column",gap:5}}>{label&&<span style={{fontSize:11,fontWeight:600,color:"var(--text2)",letterSpacing:".05em",textTransform:"uppercase"}}>{label}</span>}<select {...p} style={{padding:"9px 12px",borderRadius:10,border:"1.5px solid var(--border)",background:"var(--surface)",color:"var(--text)",fontSize:13,width:"100%",...p.style}}>{children}</select></label>);}
function Btn({variant="primary",size="md",children,...p}){const base={border:"none",cursor:"pointer",fontWeight:600,borderRadius:10,fontSize:size==="sm"?11:13,padding:size==="sm"?"5px 11px":"9px 20px",lineHeight:1.4,letterSpacing:"-.01em"};const v={primary:{background:"var(--purple)",color:"#fff",boxShadow:"0 2px 10px rgba(116,71,225,.28)"},secondary:{background:"var(--surface)",color:"var(--text)",border:"1.5px solid var(--border)"},ghost:{background:"transparent",color:"var(--text2)"},danger:{background:"var(--red-bg)",color:"var(--red)"}};return <button {...p} style={{...base,...(v[variant]||v.secondary),...p.style}}>{children}</button>;}
function Card({children,style}){return <div style={{background:"var(--surface)",border:"1.5px solid var(--border)",borderRadius:16,padding:18,boxShadow:"var(--shadow-sm)",...style}}>{children}</div>;}
function Toast({toast}){if(!toast)return null;return(<div style={{position:"fixed",bottom:20,left:"50%",transform:"translateX(-50%)",background:toast.type==="error"?"var(--red)":"var(--text)",color:"#fff",padding:"10px 18px",borderRadius:10,fontSize:13,fontWeight:600,boxShadow:"var(--shadow-md)",zIndex:999}}>{toast.msg}</div>);}

const FORM_ENTIDADE_VAZIO={nome:"",saldoInicial:"",parcelas:"",valorParcela:"",descontoAntecipacao:"",primeiroVencimento:""};
function SecaoEntidades({titulo,itens,tipoLabel,saldoFn,extratoFn,parcelasFn,situacaoFn,contasRef,onAdd,onUpdate,onDelete,expandido,setExpandido,cor}){
  const[form,setForm]=useState(null); // FORM_ENTIDADE_VAZIO ou null — criação
  const[editId,setEditId]=useState(null); // id em edição
  const[editForm,setEditForm]=useState(FORM_ENTIDADE_VAZIO);
  const ehDivida=tipoLabel==="dívida";
  function startEdit(it){
    setEditId(it.id);
    setEditForm({nome:it.nome,saldoInicial:String(it.saldoInicial),parcelas:it.parcelas?String(it.parcelas):"",valorParcela:it.valorParcela?String(it.valorParcela):"",descontoAntecipacao:it.descontoAntecipacao?String(it.descontoAntecipacao):"",primeiroVencimento:it.primeiroVencimento||""});
    setExpandido(null);
  }
  function montarPayload(f){
    const p={nome:f.nome.trim(),saldoInicial:Number(f.saldoInicial)||0};
    if(ehDivida){p.parcelas=f.parcelas?Number(f.parcelas):null;p.valorParcela=f.valorParcela?Number(f.valorParcela):null;p.descontoAntecipacao=f.descontoAntecipacao?Number(f.descontoAntecipacao):null;p.primeiroVencimento=f.primeiroVencimento||null;}
    return p;
  }
  function saveEdit(){
    if(!editForm.nome.trim())return;
    onUpdate(editId,montarPayload(editForm));
    setEditId(null);
  }
  return(
    <Card style={{marginTop:16}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div style={{fontSize:13,fontWeight:700,color:"var(--text2)",textTransform:"uppercase",letterSpacing:".04em"}}>{titulo}</div>
        <Btn size="sm" variant="secondary" onClick={()=>setForm(form?null:{...FORM_ENTIDADE_VAZIO})}>{form?"Cancelar":"+ Nova"}</Btn>
      </div>
      {form&&(
        <div style={{marginBottom:14}}>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:ehDivida?8:0}}>
            <div style={{flex:2,minWidth:140}}><FInput placeholder="Nome" value={form.nome} onChange={e=>setForm({...form,nome:e.target.value})}/></div>
            <div style={{flex:1,minWidth:100}}><FInput type="number" placeholder={ehDivida?"Valor devido":"Saldo atual"} value={form.saldoInicial} onChange={e=>setForm({...form,saldoInicial:e.target.value})}/></div>
          </div>
          {ehDivida&&(
            <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:8}}>
              <div style={{width:90}}><FInput type="number" placeholder="Nº parcelas" value={form.parcelas} onChange={e=>setForm({...form,parcelas:e.target.value})}/></div>
              <div style={{width:110}}><FInput type="number" placeholder="Valor/parcela" value={form.valorParcela} onChange={e=>setForm({...form,valorParcela:e.target.value})}/></div>
              <div style={{width:110}}><FInput type="number" placeholder="% desc. antecip." value={form.descontoAntecipacao} onChange={e=>setForm({...form,descontoAntecipacao:e.target.value})}/></div>
              <div style={{width:150}}><FInput type="date" placeholder="Vencimento 1ª parcela" value={form.primeiroVencimento} onChange={e=>setForm({...form,primeiroVencimento:e.target.value})}/></div>
            </div>
          )}
          <Btn onClick={()=>{if(!form.nome.trim())return;onAdd(montarPayload(form));setForm(null);}}>Salvar</Btn>
        </div>
      )}
      {itens.length===0&&!form&&<div style={{fontSize:12,color:"var(--text3)"}}>Nenhuma {tipoLabel} cadastrada ainda.</div>}
      <div style={{display:"flex",flexDirection:"column",gap:6}}>
        {itens.map(it=>{
          const saldo=saldoFn(it.id);
          const aberto=expandido&&expandido.id===it.id;
          const editando=editId===it.id;
          const parc=parcelasFn?parcelasFn(it.id):null;
          const sitParc=situacaoFn?situacaoFn(it.id):null;
          if(editando)return(
            <div key={it.id} style={{padding:"10px 12px",background:"var(--surface2)",borderRadius:10}}>
              <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:ehDivida?8:0}}>
                <div style={{flex:2,minWidth:120}}><FInput value={editForm.nome} onChange={e=>setEditForm({...editForm,nome:e.target.value})}/></div>
                <div style={{flex:1,minWidth:90}}><FInput type="number" value={editForm.saldoInicial} onChange={e=>setEditForm({...editForm,saldoInicial:e.target.value})}/></div>
              </div>
              {ehDivida&&(
                <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:8}}>
                  <div style={{width:90}}><FInput type="number" placeholder="Nº parcelas" value={editForm.parcelas} onChange={e=>setEditForm({...editForm,parcelas:e.target.value})}/></div>
                  <div style={{width:110}}><FInput type="number" placeholder="Valor/parcela" value={editForm.valorParcela} onChange={e=>setEditForm({...editForm,valorParcela:e.target.value})}/></div>
                  <div style={{width:110}}><FInput type="number" placeholder="% desc. antecip." value={editForm.descontoAntecipacao} onChange={e=>setEditForm({...editForm,descontoAntecipacao:e.target.value})}/></div>
                  <div style={{width:150}}><FInput type="date" placeholder="Vencimento 1ª parcela" value={editForm.primeiroVencimento} onChange={e=>setEditForm({...editForm,primeiroVencimento:e.target.value})}/></div>
                </div>
              )}
              <div style={{display:"flex",gap:8}}>
                <Btn size="sm" onClick={saveEdit}>Salvar</Btn>
                <Btn size="sm" variant="ghost" onClick={()=>setEditId(null)}>Cancelar</Btn>
              </div>
            </div>
          );
          return(
            <div key={it.id}>
              <div onClick={()=>setExpandido(aberto?null:{id:it.id})} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 12px",background:"var(--surface2)",borderRadius:10,cursor:"pointer"}}>
                <div style={{fontWeight:600,fontSize:13}}>{it.nome}</div>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <div style={{fontWeight:700,fontSize:13,color:cor(saldo)}}>{brl(saldo)}</div>
                  <button onClick={e=>{e.stopPropagation();startEdit(it);}} style={{border:"none",background:"none",color:"var(--text3)",cursor:"pointer",fontSize:12}}>✎</button>
                  <button onClick={e=>{e.stopPropagation();if(confirm(`Excluir "${it.nome}"? Os lançamentos ligados a ela continuam no histórico.`))onDelete(it.id);}} style={{border:"none",background:"none",color:"var(--text3)",cursor:"pointer",fontSize:12}}>✕</button>
                </div>
              </div>
              {parc&&(
                <div style={{padding:"6px 12px",fontSize:11,color:"var(--text2)",display:"flex",flexWrap:"wrap",gap:"4px 10px"}}>
                  <span>{parc.pagas}/{parc.parcelas} parcelas pagas</span>
                  {parc.restantes>0&&<span>· faltam {brl(parc.valorNominalRestante)}</span>}
                  {parc.totalJuros>0&&<span>· {brl(parc.totalJuros)} pagos em juros</span>}
                  {parc.restantes>0&&parc.desconto>0&&<span style={{color:"var(--green)",fontWeight:600}}>· quitando agora com {parc.desconto}% de desconto: {brl(parc.valorQuitacaoAntecipada)} (economiza {brl(parc.economia)})</span>}
                  {sitParc&&sitParc.atrasadas>0&&<span style={{color:"var(--red)",fontWeight:700}}>· {sitParc.atrasadas} parcela{sitParc.atrasadas>1?"s":""} atrasada{sitParc.atrasadas>1?"s":""}</span>}
                  {sitParc&&sitParc.atrasadas===0&&sitParc.proximoVencimento&&<span>· próxima (parcela {sitParc.proximoNumero}) vence {fmtDataBR(sitParc.proximoVencimento)}</span>}
                </div>
              )}
              {aberto&&(
                <div style={{padding:"8px 12px",fontSize:12,color:"var(--text2)"}}>
                  {extratoFn(it.id).length===0?<div style={{color:"var(--text3)"}}>Sem lançamentos ainda.</div>:extratoFn(it.id).map(l=>{
                    if(l.tipo==="transferencia"){
                      const credito=l.contaDestinoId===it.id;
                      const outraId=credito?l.contaOrigemId:l.contaDestinoId;
                      const outraNome=((contasRef||[]).find(c=>c.id===outraId)||{}).nome||"?";
                      return(
                        <div key={l.id} style={{display:"flex",justifyContent:"space-between",padding:"4px 0",borderBottom:"1px solid var(--border)"}}>
                          <span>{fmtDataBR(l.data)} · Transferência {credito?"de":"para"} {outraNome}{l.descricao?` · ${l.descricao}`:""}</span>
                          <span style={{fontWeight:600,color:"var(--purple)"}}>{credito?"+":"−"}{brl(l.valor)}</span>
                        </div>
                      );
                    }
                    return(
                      <div key={l.id} style={{display:"flex",justifyContent:"space-between",padding:"4px 0",borderBottom:"1px solid var(--border)"}}>
                        <span>{fmtDataBR(l.data)} · {l.categoria}{rotuloParcela(l)}{l.descricao?` · ${l.descricao}`:""}</span>
                        <span style={{fontWeight:600,color:l.tipo==="receita"?"var(--green)":"var(--red)"}}>{l.tipo==="receita"?"+":"−"}{brl(l.valor)}</span>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </Card>
  );
}

function FormLancamento({contas,dividas,contasAVencer,categorias,parcelasFn,onAdd,onUpdate,onAddConta,showToast,editando,onCancelEdit}){
  const[tipo,setTipo]=useState("despesa");
  const[valor,setValor]=useState("");
  const[data,setData]=useState(hojeISO());
  const cats=categorias[tipo]||[]; // tipo "transferencia" nao tem categorias — categorias[tipo] vira undefined
  const[categoria,setCategoria]=useState(cats[0]);
  const[contaId,setContaId]=useState("");
  const[dividaId,setDividaId]=useState("");
  const[numeroParcela,setNumeroParcela]=useState("");
  const[ajusteTipo,setAjusteTipo]=useState("nenhum"); // nenhum | juros | desconto
  const[ajusteValor,setAjusteValor]=useState("");
  const[contaVencerId,setContaVencerId]=useState("");
  const[contaOrigemId,setContaOrigemId]=useState("");
  const[contaDestinoId,setContaDestinoId]=useState("");
  const[descricao,setDescricao]=useState("");
  const[novaConta,setNovaConta]=useState({nome:"",saldoInicial:""});
  const formRef=useRef();
  useEffect(()=>{
    if(!editando)return;
    setTipo(editando.tipo);setValor(String(editando.valor));setData(editando.data);
    setCategoria(editando.categoria||"");setContaId(editando.contaId||"");
    setDividaId(editando.dividaId||"");setContaVencerId(editando.contaVencerId||"");
    setContaOrigemId(editando.contaOrigemId||"");setContaDestinoId(editando.contaDestinoId||"");
    setNumeroParcela(editando.numeroParcela?String(editando.numeroParcela):"");
    if(editando.juros){setAjusteTipo("juros");setAjusteValor(String(editando.juros));}
    else if(editando.desconto){setAjusteTipo("desconto");setAjusteValor(String(editando.desconto));}
    else{setAjusteTipo("nenhum");setAjusteValor("");}
    setDescricao(editando.descricao||"");
    if(formRef.current)formRef.current.scrollIntoView({behavior:"smooth",block:"center"});
  },[editando]);
  useEffect(()=>{if(!contaId&&contas.length)setContaId(contas[0].id);},[contas]);
  function handleTipo(t){setTipo(t);if(t!=="transferencia")setCategoria(categorias[t][0]);}
  function criarConta(){
    if(!novaConta.nome.trim())return;
    onAddConta({nome:novaConta.nome.trim(),saldoInicial:Number(novaConta.saldoInicial)||0});
    setNovaConta({nome:"",saldoInicial:""});
  }
  const precisaDivida=tipo!=="transferencia"&&categoria==="Pagamento de dívida";
  const precisaContaVencer=tipo!=="transferencia"&&categoria==="Pagamento de conta a vencer";
  const parcelasDaDivida=precisaDivida&&dividaId&&parcelasFn?parcelasFn(dividaId):null;
  function escolherDivida(id){
    setDividaId(id);setNumeroParcela("");
    const d=dividas.find(x=>x.id===id);
    if(d&&d.valorParcela)setValor(String(d.valorParcela));
  }
  // Valor tem que ser o total que realmente saiu da conta (parcela + juros, ou parcela - desconto) — recalcula
  // sozinho a partir do valorParcela da dívida toda vez que o ajuste muda, pra não depender de soma manual.
  function ajustarValorComBase(tipoAjuste,valorAjusteStr){
    const d=dividas.find(x=>x.id===dividaId);
    if(!d||!d.valorParcela)return;
    const base=Number(d.valorParcela);
    const ajuste=Number(valorAjusteStr)||0;
    const novo=tipoAjuste==="juros"?base+ajuste:tipoAjuste==="desconto"?base-ajuste:base;
    setValor(String(novo));
  }
  function handleAjusteTipo(t){setAjusteTipo(t);setAjusteValor("");ajustarValorComBase(t,"");}
  function handleAjusteValor(v){setAjusteValor(v);ajustarValorComBase(ajusteTipo,v);}
  function escolherContaVencer(id){
    setContaVencerId(id);
    const cv=contasAVencer.find(c=>c.id===id);
    if(cv){setDescricao(cv.nome);if(cv.valorEstimado)setValor(String(cv.valorEstimado));}
  }
  function limpar(){setValor("");setDescricao("");setNumeroParcela("");setAjusteTipo("nenhum");setAjusteValor("");}
  function cancelar(){onCancelEdit();limpar();setData(hojeISO());}
  const travaCliqueDuplo=useRef(false); // clique duplo no Adicionar duplicava o lançamento
  function submit(){
    if(travaCliqueDuplo.current)return;
    if(!valor||Number(valor)<=0){showToast("Informe um valor válido.","error");return;}
    let payload;
    if(tipo==="transferencia"){
      if(contas.length<2){showToast("Cadastre pelo menos duas contas primeiro.","error");return;}
      if(!contaOrigemId||!contaDestinoId){showToast("Selecione de onde e pra onde vai a transferência.","error");return;}
      if(contaOrigemId===contaDestinoId){showToast("Escolha contas diferentes pra origem e destino.","error");return;}
      payload={tipo,valor:Number(valor),data,contaOrigemId,contaDestinoId,descricao:descricao.trim()};
    }else{
      if(!contas.length){showToast("Cadastre uma conta primeiro (onde esse dinheiro está).","error");return;}
      if(precisaDivida&&!dividaId){showToast("Selecione a dívida que está sendo paga.","error");return;}
      if(precisaContaVencer&&!contaVencerId){showToast("Selecione a conta a vencer que está sendo paga.","error");return;}
      if(precisaDivida&&ajusteTipo!=="nenhum"&&(!ajusteValor||Number(ajusteValor)<=0)){showToast("Informe o valor do juros/desconto, ou volte pra \"Nenhum\".","error");return;}
      payload={tipo,valor:Number(valor),data,categoria,contaId,
        dividaId:precisaDivida?dividaId:undefined,
        numeroParcela:precisaDivida&&numeroParcela?Number(numeroParcela):undefined,
        juros:precisaDivida&&ajusteTipo==="juros"?Number(ajusteValor):undefined,
        desconto:precisaDivida&&ajusteTipo==="desconto"?Number(ajusteValor):undefined,
        contaVencerId:precisaContaVencer?contaVencerId:undefined,
        descricao:descricao.trim()};
    }
    travaCliqueDuplo.current=true;
    setTimeout(()=>{travaCliqueDuplo.current=false;},600);
    if(editando){
      onUpdate(editando.id,payload);
      onCancelEdit();
      setData(hojeISO()); // sai do modo edição sem deixar a data "grudada" na data antiga
      showToast("Lançamento atualizado.");
    }else{
      onAdd(payload);
      showToast("Lançamento adicionado.");
    }
    limpar();
  }
  return(
    <div ref={formRef}>
    <Card style={{marginTop:16,...(editando?{border:"1.5px solid var(--purple)"}:{})}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div style={{fontSize:13,fontWeight:700,color:"var(--text2)",textTransform:"uppercase",letterSpacing:".04em"}}>{editando?"Editando lançamento":"Novo lançamento"}</div>
        {editando&&<Btn size="sm" variant="ghost" onClick={cancelar}>Cancelar</Btn>}
      </div>
      <div style={{display:"flex",gap:8,marginBottom:12}}>
        <Btn variant={tipo==="despesa"?"danger":"secondary"} onClick={()=>handleTipo("despesa")} style={{flex:1}}>Despesa</Btn>
        <Btn variant={tipo==="receita"?"primary":"secondary"} onClick={()=>handleTipo("receita")} style={{flex:1,...(tipo==="receita"?{background:"var(--green)",boxShadow:"none"}:{})}}>Receita</Btn>
        <Btn variant={tipo==="transferencia"?"primary":"secondary"} onClick={()=>handleTipo("transferencia")} style={{flex:1,...(tipo==="transferencia"?{background:"var(--purple)",boxShadow:"none"}:{})}}>Transferência</Btn>
      </div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:8}}>
        <div style={{flex:1,minWidth:110}}><FInput label="Valor" type="number" step="0.01" placeholder="0,00" value={valor} onChange={e=>setValor(e.target.value)}/></div>
        <div style={{flex:1,minWidth:130}}><FInput label="Data" type="date" value={data} onChange={e=>setData(e.target.value)}/></div>
      </div>
      {tipo==="transferencia"?(
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:8}}>
          <div style={{flex:1,minWidth:130}}><FSelect label="De" value={contaOrigemId} onChange={e=>setContaOrigemId(e.target.value)}><option value="">Selecione</option>{contas.map(c=><option key={c.id} value={c.id}>{c.nome}</option>)}</FSelect></div>
          <div style={{flex:1,minWidth:130}}><FSelect label="Para" value={contaDestinoId} onChange={e=>setContaDestinoId(e.target.value)}><option value="">Selecione</option>{contas.map(c=><option key={c.id} value={c.id}>{c.nome}</option>)}</FSelect></div>
        </div>
      ):(
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:8}}>
        <div style={{flex:1,minWidth:150}}><FSelect label="Categoria" value={categoria} onChange={e=>setCategoria(e.target.value)}>{cats.map(c=><option key={c} value={c}>{c}</option>)}</FSelect></div>
        {contas.length===0?(
          <div style={{flex:1,minWidth:220}}>
            <span style={{fontSize:11,fontWeight:600,color:"var(--text2)",letterSpacing:".05em",textTransform:"uppercase",display:"block",marginBottom:5}}>Conta (nenhuma cadastrada)</span>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              <div style={{flex:1,minWidth:110}}><input placeholder="Nome (ex: Nubank)" value={novaConta.nome} onChange={e=>setNovaConta({...novaConta,nome:e.target.value})} onKeyDown={e=>{if(e.key==="Enter")criarConta();}} style={{padding:"9px 12px",borderRadius:10,border:"1.5px solid var(--border)",fontSize:13,width:"100%"}}/></div>
              <div style={{width:90}}><input type="number" placeholder="Saldo" value={novaConta.saldoInicial} onChange={e=>setNovaConta({...novaConta,saldoInicial:e.target.value})} onKeyDown={e=>{if(e.key==="Enter")criarConta();}} style={{padding:"9px 12px",borderRadius:10,border:"1.5px solid var(--border)",fontSize:13,width:"100%"}}/></div>
              <Btn size="sm" onClick={criarConta}>Cadastrar</Btn>
            </div>
          </div>
        ):(
          <div style={{flex:1,minWidth:130}}><FSelect label="Conta" value={contaId} onChange={e=>setContaId(e.target.value)}>{contas.map(c=><option key={c.id} value={c.id}>{c.nome}</option>)}</FSelect></div>
        )}
      </div>
      )}
      {precisaDivida&&(
        <div>
          <div style={{marginBottom:8}}><FSelect label="Qual dívida está sendo paga" value={dividaId} onChange={e=>escolherDivida(e.target.value)}><option value="">Selecione</option>{dividas.map(d=><option key={d.id} value={d.id}>{d.nome}</option>)}</FSelect></div>
          {parcelasDaDivida&&(
            <div style={{marginBottom:8}}><FSelect label="Qual parcela" value={numeroParcela} onChange={e=>setNumeroParcela(e.target.value)}>
              <option value="">Selecione</option>
              {Array.from({length:parcelasDaDivida.parcelas},(_,i)=>i+1).map(n=>(
                <option key={n} value={n}>{n}{parcelasDaDivida.numerosPagos.includes(n)?" (já paga)":""}</option>
              ))}
            </FSelect></div>
          )}
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:8}}>
            <div style={{flex:1,minWidth:150}}><FSelect label="Juros ou desconto?" value={ajusteTipo} onChange={e=>handleAjusteTipo(e.target.value)}>
              <option value="nenhum">Nenhum</option>
              <option value="juros">Juros (não abate a dívida)</option>
              <option value="desconto">Desconto (abate a mais)</option>
            </FSelect></div>
            {ajusteTipo!=="nenhum"&&(
              <div style={{flex:1,minWidth:120}}><FInput label={ajusteTipo==="juros"?"Valor do juros":"Valor do desconto"} type="number" step="0.01" placeholder="0,00" value={ajusteValor} onChange={e=>handleAjusteValor(e.target.value)}/></div>
            )}
          </div>
        </div>
      )}
      {precisaContaVencer&&(
        <div style={{marginBottom:8}}><FSelect label="Qual conta a vencer está sendo paga" value={contaVencerId} onChange={e=>escolherContaVencer(e.target.value)}><option value="">Selecione</option>{contasAVencer.map(c=><option key={c.id} value={c.id}>{c.nome}</option>)}</FSelect></div>
      )}
      <div style={{marginBottom:12}}><FInput label="Descrição (opcional)" value={descricao} onChange={e=>setDescricao(e.target.value)}/></div>
      <Btn onClick={submit} style={{width:"100%"}}>{editando?"Salvar alterações":"Adicionar"}</Btn>
    </Card>
    </div>
  );
}

function SecaoContasAVencer({itens,situacaoFn,onAdd,onUpdate,onDelete}){
  const[form,setForm]=useState(null); // {nome,diaVencimento,valorEstimado} ou null
  const[editId,setEditId]=useState(null);
  const[editForm,setEditForm]=useState({nome:"",diaVencimento:"",valorEstimado:""});
  function startEdit(it){setEditId(it.id);setEditForm({nome:it.nome,diaVencimento:it.diaVencimento?String(it.diaVencimento):"",valorEstimado:it.valorEstimado?String(it.valorEstimado):""});}
  function saveEdit(){
    if(!editForm.nome.trim())return;
    onUpdate(editId,{nome:editForm.nome.trim(),diaVencimento:editForm.diaVencimento?Number(editForm.diaVencimento):null,valorEstimado:editForm.valorEstimado?Number(editForm.valorEstimado):null});
    setEditId(null);
  }
  const ordenados=[...itens].sort((a,b)=>(a.diaVencimento||99)-(b.diaVencimento||99));
  return(
    <Card style={{marginTop:16}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div style={{fontSize:13,fontWeight:700,color:"var(--text2)",textTransform:"uppercase",letterSpacing:".04em"}}>Contas a vencer</div>
        <Btn size="sm" variant="secondary" onClick={()=>setForm(form?null:{nome:"",diaVencimento:"",valorEstimado:""})}>{form?"Cancelar":"+ Nova"}</Btn>
      </div>
      {form&&(
        <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
          <div style={{flex:2,minWidth:130}}><FInput placeholder="Nome (ex: Internet)" value={form.nome} onChange={e=>setForm({...form,nome:e.target.value})}/></div>
          <div style={{width:90}}><FInput type="number" min="1" max="31" placeholder="Dia venc." value={form.diaVencimento} onChange={e=>setForm({...form,diaVencimento:e.target.value})}/></div>
          <div style={{width:110}}><FInput type="number" placeholder="Valor aprox." value={form.valorEstimado} onChange={e=>setForm({...form,valorEstimado:e.target.value})}/></div>
          <Btn onClick={()=>{if(!form.nome.trim())return;onAdd({nome:form.nome.trim(),diaVencimento:form.diaVencimento?Number(form.diaVencimento):null,valorEstimado:form.valorEstimado?Number(form.valorEstimado):null});setForm(null);}}>Salvar</Btn>
        </div>
      )}
      {itens.length===0&&!form&&<div style={{fontSize:12,color:"var(--text3)"}}>Nada cadastrado ainda. Dia de vencimento e valor são opcionais.</div>}
      <div style={{display:"flex",flexDirection:"column",gap:6}}>
        {ordenados.map(it=>{
          const editando=editId===it.id;
          if(editando)return(
            <div key={it.id} style={{display:"flex",gap:8,padding:"10px 12px",background:"var(--surface2)",borderRadius:10,flexWrap:"wrap"}}>
              <div style={{flex:2,minWidth:110}}><FInput value={editForm.nome} onChange={e=>setEditForm({...editForm,nome:e.target.value})}/></div>
              <div style={{width:80}}><FInput type="number" min="1" max="31" value={editForm.diaVencimento} onChange={e=>setEditForm({...editForm,diaVencimento:e.target.value})}/></div>
              <div style={{width:100}}><FInput type="number" value={editForm.valorEstimado} onChange={e=>setEditForm({...editForm,valorEstimado:e.target.value})}/></div>
              <Btn size="sm" onClick={saveEdit}>Salvar</Btn>
              <Btn size="sm" variant="ghost" onClick={()=>setEditId(null)}>Cancelar</Btn>
            </div>
          );
          const sit=situacaoFn(it.id);
          let badge=null,badgeCor="var(--text3)",badgeBg="var(--surface2)";
          if(sit&&sit.status==="pago"){badge=`pago em ${fmtDataBR(sit.ultimoPagamento)}`;badgeCor="var(--green)";badgeBg="var(--green-bg)";}
          else if(sit&&sit.status==="atrasada"){badge=`atrasada há ${sit.dias}d`;badgeCor="var(--red)";badgeBg="var(--red-bg)";}
          else if(sit&&sit.dias!==null){
            badge=sit.dias===0?"vence hoje":`vence em ${sit.dias}d`;
            if(sit.dias<=5){badgeCor="var(--red)";badgeBg="var(--red-bg)";}
            else if(sit.dias<=10){badgeCor="var(--amber)";badgeBg="var(--amber-bg)";}
          }
          return(
            <div key={it.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 12px",background:"var(--surface2)",borderRadius:10}}>
              <div>
                <div style={{fontWeight:600,fontSize:13}}>{it.nome}{it.diaVencimento?` · todo dia ${it.diaVencimento}`:""}</div>
                {it.valorEstimado?<div style={{fontSize:11,color:"var(--text3)"}}>~{brl(it.valorEstimado)}</div>:null}
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                {badge&&<span style={{fontSize:11,fontWeight:700,padding:"3px 8px",borderRadius:10,background:badgeBg,color:badgeCor,whiteSpace:"nowrap"}}>{badge}</span>}
                <button onClick={()=>startEdit(it)} style={{border:"none",background:"none",color:"var(--text3)",cursor:"pointer",fontSize:12}}>✎</button>
                <button onClick={()=>{if(confirm(`Excluir "${it.nome}"?`))onDelete(it.id);}} style={{border:"none",background:"none",color:"var(--text3)",cursor:"pointer",fontSize:12}}>✕</button>
              </div>
            </div>
          );
        })}
      </div>
    </Card>
  );
}

function SecaoCategorias({categorias,onAdd,onDelete}){
  const[form,setForm]=useState(false);
  const[tipo,setTipo]=useState("despesa");
  const[nome,setNome]=useState("");
  function submit(){
    const n=nome.trim();
    if(!n||categorias[tipo].includes(n)){setNome("");setForm(false);return;}
    onAdd(tipo,n);setNome("");setForm(false);
  }
  return(
    <Card style={{marginTop:16}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div style={{fontSize:13,fontWeight:700,color:"var(--text2)",textTransform:"uppercase",letterSpacing:".04em"}}>Categorias</div>
        <Btn size="sm" variant="secondary" onClick={()=>setForm(!form)}>{form?"Cancelar":"+ Nova"}</Btn>
      </div>
      {form&&(
        <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
          <div style={{minWidth:120}}><FSelect value={tipo} onChange={e=>setTipo(e.target.value)}><option value="despesa">Despesa</option><option value="receita">Receita</option></FSelect></div>
          <div style={{flex:1,minWidth:140}}><FInput placeholder="Nome da categoria" value={nome} onChange={e=>setNome(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")submit();}}/></div>
          <Btn onClick={submit}>Salvar</Btn>
        </div>
      )}
      {["despesa","receita"].map(t=>(
        <div key={t} style={{marginBottom:10}}>
          <div style={{fontSize:11,color:"var(--text3)",marginBottom:6,textTransform:"uppercase",letterSpacing:".04em"}}>{t==="despesa"?"Despesas":"Receitas"}</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
            {categorias[t].map(c=>{
              const protegida=c==="Pagamento de dívida"||c==="Pagamento de conta a vencer";
              return(
                <span key={c} style={{display:"flex",alignItems:"center",gap:6,padding:"5px 10px",background:"var(--surface2)",borderRadius:20,fontSize:12}}>
                  {c}
                  {!protegida&&<button onClick={()=>onDelete(t,c)} style={{border:"none",background:"none",color:"var(--text3)",cursor:"pointer",fontSize:11,lineHeight:1}}>✕</button>}
                </span>
              );
            })}
          </div>
        </div>
      ))}
    </Card>
  );
}

function GraficoCategorias({porCategoria}){
  if(!porCategoria.length)return null;
  const max=porCategoria[0][1];
  return(
    <Card style={{marginTop:16}}>
      <div style={{fontSize:13,fontWeight:700,color:"var(--text2)",textTransform:"uppercase",letterSpacing:".04em",marginBottom:12}}>Despesas por categoria (mês)</div>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {porCategoria.map(([cat,val])=>(
          <div key={cat}>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:3}}><span>{cat}</span><span style={{fontWeight:600}}>{brl(val)}</span></div>
            <div style={{height:7,background:"var(--surface2)",borderRadius:4,overflow:"hidden"}}><div style={{height:"100%",width:`${(val/max)*100}%`,background:"var(--purple)",borderRadius:4}}/></div>
          </div>
        ))}
      </div>
    </Card>
  );
}

function ListaLancamentos({lancamentos,contas,dividas,onDelete,onEdit}){
  const contaNome=id=>(contas.find(c=>c.id===id)||{}).nome||"—";
  return(
    <Card style={{marginTop:16}}>
      <div style={{fontSize:13,fontWeight:700,color:"var(--text2)",textTransform:"uppercase",letterSpacing:".04em",marginBottom:12}}>Lançamentos do mês</div>
      {lancamentos.length===0&&<div style={{fontSize:12,color:"var(--text3)"}}>Nenhum lançamento neste mês.</div>}
      <div style={{display:"flex",flexDirection:"column",gap:6}}>
        {lancamentos.map(l=>{
          const transferencia=l.tipo==="transferencia";
          return(
          <div key={l.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 12px",background:"var(--surface2)",borderRadius:10}}>
            <div>
              <div style={{fontWeight:600,fontSize:13}}>{transferencia?"Transferência":l.categoria}{transferencia?"":rotuloParcela(l)}{l.descricao?` · ${l.descricao}`:""}</div>
              <div style={{fontSize:11,color:"var(--text3)"}}>{fmtDataBR(l.data)} · {transferencia?`${contaNome(l.contaOrigemId)} → ${contaNome(l.contaDestinoId)}`:contaNome(l.contaId)}</div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <div style={{fontWeight:700,fontSize:13,color:transferencia?"var(--purple)":l.tipo==="receita"?"var(--green)":"var(--red)"}}>{transferencia?"":l.tipo==="receita"?"+":"−"}{brl(l.valor)}</div>
              <button onClick={()=>onEdit(l)} style={{border:"none",background:"none",color:"var(--text3)",cursor:"pointer",fontSize:12}}>✎</button>
              <button onClick={()=>{if(confirm("Excluir este lançamento?"))onDelete(l.id);}} style={{border:"none",background:"none",color:"var(--text3)",cursor:"pointer",fontSize:12}}>✕</button>
            </div>
          </div>
          );
        })}
      </div>
    </Card>
  );
}

function App(){
  const[authReady,setAuthReady]=useState(false);
  const[user,setUser]=useState(null);
  const[denied,setDenied]=useState(false);
  const[data,setData]=useState({contas:[],dividas:[],lancamentos:[]});
  const[loaded,setLoaded]=useState(false);
  const[mesRef,setMesRef]=useState(mesAtualRef());
  const[toast,setToast]=useState(null);
  const[expContas,setExpContas]=useState(null);
  const[expDividas,setExpDividas]=useState(null);
  const[editando,setEditando]=useState(null); // lançamento em edição, ou null

  function showToast(msg,type){setToast({msg,type});setTimeout(()=>setToast(null),3000);}

  useEffect(()=>{
    const unsub=fbAuth.onAuthStateChanged(u=>{
      setAuthReady(true);
      if(u&&u.email&&!AUTHORIZED_EMAILS.includes(u.email.toLowerCase())){setDenied(true);setUser(null);fbAuth.signOut();return;}
      if(!u){setUser(null);return;}
      setDenied(false);setUser(u);
    });
    return unsub;
  },[]);

  useEffect(()=>{
    if(!user)return;
    try{const r=localStorage.getItem(STORAGE_KEY);if(r)setData(JSON.parse(r));}catch(_){}
    (async()=>{
      try{const cloud=await fbLoad();if(cloud){setData(cloud);localStorage.setItem(STORAGE_KEY,JSON.stringify(cloud));}}
      catch(e){showToast("Erro ao carregar da nuvem — usando dados locais.","error");}
      setLoaded(true);
    })();
  },[user]);

  function persist(next){
    setData(next);
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify(next));}catch(_){}
    fbSave(next).catch(()=>showToast("Erro ao salvar na nuvem.","error"));
  }
  const addLancamento=l=>persist({...data,lancamentos:[...data.lancamentos,{...l,id:uid()}]});
  const updateLancamento=(id,l)=>persist({...data,lancamentos:data.lancamentos.map(x=>x.id===id?{...l,id}:x)});
  const delLancamento=id=>persist({...data,lancamentos:data.lancamentos.filter(l=>l.id!==id)});
  const addConta=c=>persist({...data,contas:[...data.contas,{...c,id:uid()}]});
  const updateConta=(id,c)=>persist({...data,contas:data.contas.map(x=>x.id===id?{...x,...c}:x)});
  const delConta=id=>persist({...data,contas:data.contas.filter(c=>c.id!==id)});
  const addDivida=d=>persist({...data,dividas:[...data.dividas,{...d,id:uid()}]});
  const updateDivida=(id,d)=>persist({...data,dividas:data.dividas.map(x=>x.id===id?{...x,...d}:x)});
  const delDivida=id=>persist({...data,dividas:data.dividas.filter(d=>d.id!==id)});
  const contasAVencer=data.contasAVencer||[];
  const addContaVencer=c=>persist({...data,contasAVencer:[...contasAVencer,{...c,id:uid()}]});
  const updateContaVencer=(id,c)=>persist({...data,contasAVencer:contasAVencer.map(x=>x.id===id?{...x,...c}:x)});
  const delContaVencer=id=>persist({...data,contasAVencer:contasAVencer.filter(c=>c.id!==id)});
  const categoriasDefault={receita:CAT_RECEITA,despesa:CAT_DESPESA};
  const categorias=data.categorias||categoriasDefault;
  const addCategoria=(tipo,nome)=>{
    const atual=data.categorias||categoriasDefault;
    if(atual[tipo].includes(nome))return;
    persist({...data,categorias:{...atual,[tipo]:[...atual[tipo],nome]}});
  };
  const delCategoria=(tipo,nome)=>{
    const atual=data.categorias||categoriasDefault;
    persist({...data,categorias:{...atual,[tipo]:atual[tipo].filter(c=>c!==nome)}});
  };

  const total=useMemo(()=>saldoTotal(data),[data]);
  const resumo=useMemo(()=>resumoMes(data,mesRef),[data,mesRef]);
  const lancamentosMes=useMemo(()=>data.lancamentos.filter(l=>(l.data||"").slice(0,7)===mesRef),[data,mesRef]);
  const porCategoria=useMemo(()=>despesasPorCategoria(data,mesRef),[data,mesRef]);
  const[ano,mes]=mesRef.split("-").map(Number);

  if(!authReady)return null;
  if(!user)return <LoginScreen/>;
  if(denied)return <div style={{padding:40,textAlign:"center",color:"var(--red)"}}>Esta conta não tem acesso a este app.</div>;
  if(!loaded)return <div style={{padding:40,textAlign:"center",color:"var(--text3)"}}>Carregando...</div>;

  return(
    <div style={{paddingTop:24}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16}}>
        <div>
          <div style={{fontSize:20,fontWeight:800,letterSpacing:"-.03em"}}>Finanças</div>
          <div style={{fontSize:12,color:"var(--text3)"}}>Saldo total em contas</div>
          <div style={{fontSize:26,fontWeight:800,color:total>=0?"var(--text)":"var(--red)"}}>{brl(total)}</div>
        </div>
        <Btn variant="ghost" size="sm" onClick={()=>fbAuth.signOut()}>Sair</Btn>
      </div>

      <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:16,marginBottom:16}}>
        <button onClick={()=>setMesRef(shiftMes(mesRef,-1))} style={{border:"none",background:"none",cursor:"pointer",fontSize:18,color:"var(--purple)"}}>‹</button>
        <div style={{fontWeight:700,fontSize:14}}>{MESES_PT[mes-1]} de {ano}</div>
        <button onClick={()=>setMesRef(shiftMes(mesRef,1))} style={{border:"none",background:"none",cursor:"pointer",fontSize:18,color:"var(--purple)"}}>›</button>
      </div>

      <div style={{display:"flex",gap:10}}>
        <Card style={{flex:1,textAlign:"center",padding:14}}><div style={{fontSize:11,color:"var(--text3)",marginBottom:4}}>Receitas</div><div style={{fontWeight:700,color:"var(--green)"}}>{brl(resumo.receitas)}</div></Card>
        <Card style={{flex:1,textAlign:"center",padding:14}}><div style={{fontSize:11,color:"var(--text3)",marginBottom:4}}>Despesas</div><div style={{fontWeight:700,color:"var(--red)"}}>{brl(resumo.despesas)}</div></Card>
        <Card style={{flex:1,textAlign:"center",padding:14}}><div style={{fontSize:11,color:"var(--text3)",marginBottom:4}}>Saldo do mês</div><div style={{fontWeight:700}}>{brl(resumo.saldo)}</div></Card>
      </div>

      <SecaoEntidades titulo="Contas — onde o dinheiro está" itens={data.contas} tipoLabel="conta" saldoFn={id=>saldoConta(data,id)} extratoFn={id=>extratoConta(data,id)} contasRef={data.contas} onAdd={addConta} onUpdate={updateConta} onDelete={delConta} expandido={expContas} setExpandido={setExpContas} cor={v=>v>=0?"var(--text)":"var(--red)"}/>

      <SecaoEntidades titulo="Dívidas — o que você deve" itens={data.dividas} tipoLabel="dívida" saldoFn={id=>saldoDivida(data,id)} extratoFn={id=>extratoDivida(data,id)} parcelasFn={id=>resumoParcelas(data,id)} situacaoFn={id=>situacaoParcelas(data,id)} onAdd={addDivida} onUpdate={updateDivida} onDelete={delDivida} expandido={expDividas} setExpandido={setExpDividas} cor={v=>v>0?"var(--red)":"var(--green)"}/>

      <SecaoContasAVencer itens={contasAVencer} situacaoFn={id=>situacaoContaVencer(data,id)} onAdd={addContaVencer} onUpdate={updateContaVencer} onDelete={delContaVencer}/>

      <SecaoCategorias categorias={categorias} onAdd={addCategoria} onDelete={delCategoria}/>

      <GraficoCategorias porCategoria={porCategoria}/>
      <FormLancamento contas={data.contas} dividas={data.dividas} contasAVencer={contasAVencer} categorias={categorias} parcelasFn={id=>resumoParcelas(data,id)} onAdd={addLancamento} onUpdate={updateLancamento} onAddConta={addConta} showToast={showToast} editando={editando} onCancelEdit={()=>setEditando(null)}/>
      <ListaLancamentos lancamentos={lancamentosMes} contas={data.contas} dividas={data.dividas} onDelete={delLancamento} onEdit={setEditando}/>
      <Toast toast={toast}/>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
